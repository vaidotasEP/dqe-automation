[pytest]
rp_endpoint = https://reportportal.epam.com
rp_api_key = <API key>
rp_project = vaidotas_sruogis_personal
rp_launch = Pytest Launch
rp_launch_description = DQE Automation - Report Portal - PyTest Intro HW
rp_launch_attributes = 'tag' 'key1:value1' 'key2:value2'
rp_mode = DEFAULT
rp_verify_ssl = True
rp_log_batch_size = 20
rp_log_batch_payload_size = 64000000
rp_log_level = INFO
rp_ignore_attributes = 'xfail' 'usefixture'
rp_is_skipped_an_issue = True

markers =
    unmarked: marks tests that were not explicitly marked
    validate_csv: marks tests aimed at validating various aspects of data in csv file
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
python_files = test_*.py
addopts = --strict-markers